<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tiro al Blanco</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    color: white;
    overflow: hidden;
    background: linear-gradient(90deg, green 33%, white 33%, white 66%, red 66%);
}

h1, h2, p {
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000,
                 -2px 2px 0 #000, 2px 2px 0 #000;
}

.container {
    margin-top: 60px;
    animation: fade 0.5s;
}

@keyframes fade {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity: 1; transform: scale(1);}
}

button {
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.hidden { display: none; }

/* BARRA */
.barra {
    width: 80%;
    height: 20px;
    background: rgba(0,0,0,0.3);
    margin: 20px auto;
    border-radius: 10px;
}

.progresso {
    height: 100%;
    width: 0%;
    background: yellow;
    border-radius: 10px;
    transition: 0.4s;
}

/* CINEMA */
.cinema {
    animation: zoom 1s ease;
}
@keyframes zoom {
    from {transform: scale(0.5); opacity: 0;}
    to {transform: scale(1.2); opacity: 1;}
}

/* PARTÍCULAS */
.particula {
    position: absolute;
    width: 10px;
    height: 10px;
    background: yellow;
    animation: explodir 1s forwards;
}

@keyframes explodir {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}

/* RANKING */
.ranking {
    margin-top: 20px;
    color: black;
    text-shadow: none;
}

</style>
</head>

<body>

<audio id="click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="win" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>

<!-- INÍCIO -->
<div class="container" id="inicio">
    <h1>🎯 Tiro al Blanco</h1>

    <p>Digite seu nome:</p>
    <input id="nome" placeholder="Seu nome">

    <br><br>
    <button onclick="iniciar()">Começar</button>

    <div id="ranking"></div>
</div>

<!-- JOGO -->
<div class="container hidden" id="jogo">
    <h2 id="player"></h2>
    <h2 id="rodadaTexto"></h2>

    <div class="barra">
        <div class="progresso" id="barra"></div>
    </div>

    <button onclick="jogar(0)">Errou (0)</button>
    <button onclick="jogar(10)">Fácil (+10)</button>
    <button onclick="jogar(20)">Médio (+20)</button>
    <button onclick="jogar(50)">Difícil (+50)</button>
</div>

<!-- RESULTADO -->
<div class="container hidden" id="resultado">
    <h1 id="mensagem"></h1>
    <h2 id="pontos"></h2>
    <h2 id="final"></h2>

    <button onclick="salvarRanking()">Salvar no Ranking</button>
    <button onclick="reiniciar()">Voltar ao Início</button>
</div>

<script>

let rodada = 1;
let total = 0;
let nome = "";
let meta = 120;

function som(id){
    document.getElementById(id).play();
}

function iniciar(){
    nome = document.getElementById("nome").value || "Jogador";

    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("jogo").classList.remove("hidden");

    document.getElementById("player").innerText = "👤 " + nome;

    atualizar();
}

function atualizar(){
    let txt = "Rodada " + rodada;
    if(rodada >= 4) txt += " (x2)";
    document.getElementById("rodadaTexto").innerText = txt;

    document.getElementById("barra").style.width = (rodada-1)*20 + "%";
}

function jogar(valor){
    som("click");

    if(rodada >= 4) valor *= 2;

    total += valor;
    rodada++;

    if(rodada > 5){
        finalizar();
    } else {
        atualizar();
    }
}

function finalizar(){
    document.getElementById("jogo").classList.add("hidden");

    let tela = document.getElementById("resultado");
    tela.classList.remove("hidden");
    tela.classList.add("cinema");

    document.getElementById("pontos").innerText = nome + " fez " + total + " pontos";

    if(total >= meta){
        document.getElementById("mensagem").innerText = "🏆 INCRÍVEL!";
        document.getElementById("final").innerText = "🎉 Você ganhou!";
        som("win");
        explosao();
    } else {
        document.getElementById("mensagem").innerText = "😢 Quase!";
        document.getElementById("final").innerText = "Tente novamente!";
    }
}

/* PARTÍCULAS */
function explosao(){
    for(let i=0;i<50;i++){
        let p = document.createElement("div");
        p.className = "particula";

        p.style.left = "50%";
        p.style.top = "50%";

        p.style.setProperty('--x', (Math.random()*400-200)+"px");
        p.style.setProperty('--y', (Math.random()*400-200)+"px");

        document.body.appendChild(p);

        setTimeout(()=>p.remove(),1000);
    }
}

/* RANKING */
function salvarRanking(){

    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

    ranking.push({nome: nome, pontos: total});

    ranking.sort((a,b)=> b.pontos - a.pontos);

    localStorage.setItem("ranking", JSON.stringify(ranking));

    mostrarRanking();
}

function mostrarRanking(){
    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

    let html = "<h3>🏆 Ranking</h3>";

    ranking.slice(0,5).forEach(r=>{
        html += `<p>${r.nome} - ${r.pontos}</p>`;
    });

    document.getElementById("ranking").innerHTML = html;
}

mostrarRanking();

function reiniciar(){
    rodada = 1;
    total = 0;

    document.getElementById("resultado").classList.add("hidden");
    document.getElementById("inicio").classList.remove("hidden");
}

</script>

</body>
</html>
