<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tiro al Blanco</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(90deg, #006847 33%, #ffffff 33%, #ffffff 66%, #ce1126 66%);
}

/* TELAS */
.container {
    margin-top: 60px;
}

/* ESSENCIAL */
.hidden {
    display: none;
}

/* TEXTO ATUALIZADO */
h1 {
    color: white;
    -webkit-text-stroke: 1.5px black;
    text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.5);
    font-size: 3.5em;
    margin-bottom: 10px;
}

/* BOTÃO */
button {
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #333;
}

/* INPUT VISÍVEL */
input {
    padding: 10px;
    border-radius: 10px;
    border: 2px solid black;
    color: black;
    background: white;
    width: 80%;
    max-width: 300px;
}

/* BARRA */
.barra {
    width: 80%;
    height: 20px;
    background: rgba(0,0,0,0.3);
    margin: 20px auto;
    border-radius: 10px;
}

.progresso {
    height: 100%;
    width: 0%;
    background: yellow;
    border-radius: 10px;
    transition: width 0.5s;
}

/* RANKING */
#ranking {
    margin-top: 20px;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container" id="inicio">
    <h1>🎯 Tiro al Blanco</h1>

    <p>Digite seu nome:</p>
    <input id="nome" placeholder="Seu nome aqui...">

    <br><br>
    <button onclick="iniciar()">Começar</button>

    <div id="ranking"></div>
</div>

<div class="container hidden" id="jogo">
    <h2 id="player"></h2>
    <h2 id="rodadaTexto"></h2>

    <div class="barra">
        <div class="progresso" id="barra"></div>
    </div>

    <button onclick="jogar(0)">Errou (0)</button>
    <button onclick="jogar(10)">Fácil (+10)</button>
    <button onclick="jogar(20)">Médio (+20)</button>
    <button onclick="jogar(50)">Difícil (+50)</button>
</div>

<div class="container hidden" id="resultado">
    <h1 id="mensagem"></h1>
    <h2 id="pontos"></h2>

    <button onclick="salvarRanking()">Salvar no Ranking</button>
    <button onclick="reiniciar()">Voltar</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCXY0vSi86u1VIdl475Y2NKEzE8IBLcSig",
  authDomain: "jogo-mexicano.firebaseapp.com",
  projectId: "jogo-mexicano"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let rodada = 1;
let total = 0;
let nome = "";

function iniciar(){
    nome = document.getElementById("nome").value || "Jogador";
    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("jogo").classList.remove("hidden");
    document.getElementById("player").innerText = "👤 " + nome;
    atualizar();
}

function atualizar(){
    let txt = "Rodada " + rodada;
    if(rodada >= 4) txt += " (x2)";
    document.getElementById("rodadaTexto").innerText = txt;
    document.getElementById("barra").style.width = (rodada-1)*25 + "%";
}

function jogar(valor){
    if(rodada >= 4) valor *= 2;
    total += valor;
    rodada++;
    if(rodada > 5) finalizar(); else atualizar();
}

async function finalizar(){
    document.getElementById("jogo").classList.add("hidden");
    document.getElementById("resultado").classList.remove("hidden");
    document.getElementById("pontos").innerText = nome + " fez " + total + " pontos";

    let maior = 0;
    const snapshot = await db.collection("ranking").get();
    snapshot.forEach(doc => { if(doc.data().pontos > maior) maior = doc.data().pontos; });

    document.getElementById("mensagem").innerText = total > maior && maior > 0 ? "🏆 NOVO RECORDE!" : "Resultado Final";
}

function salvarRanking(){
    db.collection("ranking").add({ nome: nome, pontos: total });
    alert("Pontuação salva!");
}

function mostrarRanking(){
    db.collection("ranking").orderBy("pontos", "desc").limit(5).onSnapshot(snapshot => {
        let html = "<h3>🏆 Ranking Top 5</h3>";
        snapshot.forEach((doc) => {
            const r = doc.data();
            html += `<p>${r.nome} - ${r.pontos} pts</p>`;
        });
        document.getElementById("ranking").innerHTML = html;
    });
}

function reiniciar(){
    rodada = 1; total = 0;
    document.getElementById("resultado").classList.add("hidden");
    document.getElementById("inicio").classList.remove("hidden");
}

mostrarRanking();
</script>
    
</body>
</html>
