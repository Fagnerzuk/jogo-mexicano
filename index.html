<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tiro al Blanco</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    color: white;
    overflow: hidden;
    background: linear-gradient(90deg, green 33%, white 33%, white 66%, red 66%);
}

h1 {
    text-shadow: 2px 2px 4px black;
}

.container {
    margin-top: 60px;
}

button {
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

.hidden { display: none; }

.barra {
    width: 80%;
    height: 20px;
    background: rgba(0,0,0,0.3);
    margin: 20px auto;
    border-radius: 10px;
}

.progresso {
    height: 100%;
    width: 0%;
    background: yellow;
    border-radius: 10px;
}

#ranking {
    margin-top: 20px;
    color: black;
    font-weight: bold;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: none;
}
</style>
</head>

<body>

<div class="container" id="inicio">
    <h1>🎯 Tiro al Blanco</h1>

    <p>Digite seu nome:</p>
    <input id="nome">

    <br><br>
    <button onclick="iniciar()">Começar</button>

    <div id="ranking"></div>
</div>

<div class="container hidden" id="jogo">
    <h2 id="player"></h2>
    <h2 id="rodadaTexto"></h2>

    <div class="barra">
        <div class="progresso" id="barra"></div>
    </div>

    <button onclick="jogar(0)">Errou (0)</button>
    <button onclick="jogar(10)">Fácil (+10)</button>
    <button onclick="jogar(20)">Médio (+20)</button>
    <button onclick="jogar(50)">Difícil (+50)</button>
</div>

<div class="container hidden" id="resultado">
    <h1 id="mensagem"></h1>
    <h2 id="pontos"></h2>
    <h2 id="final"></h2>

    <button onclick="salvarRanking()">Salvar no Ranking</button>
    <button onclick="reiniciar()">Voltar</button>
</div>

<!-- FIREBASE CDN (SEM MODULE) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCXY0vSi86u1VIdl475Y2NKEzE8IBLcSig",
  authDomain: "jogo-mexicano.firebaseapp.com",
  projectId: "jogo-mexicano"
};

// INIT
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// JOGO
let rodada = 1;
let total = 0;
let nome = "";
let meta = 120;

function iniciar(){
    nome = document.getElementById("nome").value || "Jogador";

    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("jogo").classList.remove("hidden");

    document.getElementById("player").innerText = "👤 " + nome;

    atualizar();
}

function atualizar(){
    let txt = "Rodada " + rodada;
    if(rodada >= 4) txt += " (x2)";
    document.getElementById("rodadaTexto").innerText = txt;

    document.getElementById("barra").style.width = (rodada-1)*20 + "%";
}

function jogar(valor){
    if(rodada >= 4) valor *= 2;

    total += valor;
    rodada++;

    if(rodada > 5){
        finalizar();
    } else {
        atualizar();
    }
}

async function finalizar(){
    document.getElementById("jogo").classList.add("hidden");
    document.getElementById("resultado").classList.remove("hidden");

    document.getElementById("pontos").innerText = nome + " fez " + total + " pontos";

    let maior = 0;

    const snapshot = await db.collection("ranking").get();
    snapshot.forEach(doc=>{
        if(doc.data().pontos > maior) maior = doc.data().pontos;
    });

    if(total > maior){
        document.getElementById("mensagem").innerText = "🏆 NOVO RECORDE!";
    } else {
        document.getElementById("mensagem").innerText = "Resultado final";
    }
}

function salvarRanking(){
    db.collection("ranking").add({
        nome: nome,
        pontos: total
    });

    mostrarRanking();
}

function mostrarRanking(){

    db.collection("ranking")
    .onSnapshot(snapshot => {

        let lista = [];

        snapshot.forEach(doc=>{
            lista.push(doc.data());
        });

        lista.sort((a,b)=> b.pontos - a.pontos);

        let html = "<h3>🏆 Ranking Ao Vivo</h3>";

        lista.slice(0,5).forEach((r,i)=>{
            html += `<p>${i+1}º - ${r.nome} (${r.pontos})</p>`;
        });

        document.getElementById("ranking").innerHTML = html;

    });

}

mostrarRanking();

function reiniciar(){
    rodada = 1;
    total = 0;

    document.getElementById("resultado").classList.add("hidden");
    document.getElementById("inicio").classList.remove("hidden");
}

    </script>
    
</body>
</html>
